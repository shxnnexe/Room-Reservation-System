<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Room Reservation System</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">Room Reservation System</p>
        <h1>Find your next meeting space</h1>
        <p class="intro">Browse the rooms available in the reservation system.</p>
      </header>

      <section aria-labelledby="rooms-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Workspace directory</p>
            <h2 id="rooms-heading">Available rooms</h2>
          </div>
          <button class="button button-secondary" id="refresh-rooms" type="button">Refresh rooms</button>
        </div>
        <p class="status" id="rooms-status" role="status" aria-live="polite">Loading rooms...</p>
        <div class="room-grid" id="rooms-list"></div>
      </section>

      <section class="workflow-section" aria-labelledby="sign-in-heading" id="sign-in-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Your account</p>
            <h2 id="sign-in-heading">Sign in to reserve a room</h2>
          </div>
        </div>
        <form class="form-card" id="login-form">
          <label>
            Email
            <input autocomplete="username" name="email" type="email" required>
          </label>
          <label>
            Password
            <input autocomplete="current-password" name="password" type="password" required>
          </label>
          <button class="button button-primary" type="submit">Sign in</button>
          <p class="status" id="login-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="workflow-section" aria-labelledby="reservation-heading" id="reservation-panel" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Make a booking</p>
            <h2 id="reservation-heading">Reserve a room</h2>
          </div>
        </div>
        <form class="form-card" id="reservation-form">
          <label>
            Room
            <select id="reservation-room" name="roomId" required>
              <option value="">Choose a room</option>
            </select>
          </label>
          <div class="form-row">
            <label>
              Start date
              <input id="reservation-start" name="startDate" type="date" required>
            </label>
            <label>
              End date
              <input id="reservation-end" name="endDate" type="date" required>
            </label>
          </div>
          <button class="button button-primary" id="reservation-submit" type="submit">Create reservation</button>
          <p class="status" id="reservation-status" role="status" aria-live="polite"></p>
        </form>

        <div class="reservation-list-section">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Your bookings</p>
              <h2>Your reservations</h2>
            </div>
            <button class="button button-secondary" id="refresh-reservations" type="button">Refresh reservations</button>
          </div>
          <p class="status" id="reservations-status" role="status" aria-live="polite"></p>
          <div class="reservation-list" id="reservations-list"></div>
        </div>
      </section>
    </main>
  </body>
</html>
